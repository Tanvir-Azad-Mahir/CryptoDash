<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoViz Pro - Cryptocurrency Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1426 0%, #1a1f35 100%);
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(17, 25, 45, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 10px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            flex: 1;
            max-width: 500px;
        }

        #searchInput {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #searchInput:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        .stat-change {
            font-size: 14px;
            margin-top: 8px;
        }

        .positive { color: #10b981; }
        .negative { color: #ef4444; }

        /* Market Overview */
        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .market-title {
            color: white;
            font-size: 24px;
            font-weight: 600;
        }

        .filters {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        /* Coins Table */
        .coins-table-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .coins-table {
            width: 100%;
            border-collapse: collapse;
        }

        .coins-table th {
            text-align: left;
            padding: 15px 10px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .coins-table td {
            padding: 15px 10px;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .coin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .coin-name {
            font-weight: 600;
        }

        .coin-symbol {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
        }

        .price-cell {
            font-weight: 600;
        }

        .sparkline {
            width: 120px;
            height: 40px;
        }

        /* Loading States */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #667eea;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            padding: 20px;
            color: #ef4444;
            text-align: center;
            margin: 30px 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1f35;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: white;
        }

        .modal-coin-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .modal-coin-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
        }

        .modal-coin-title h2 {
            color: white;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .modal-coin-title p {
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .modal-stat {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
        }

        .modal-stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .modal-stat-value {
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 20px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .coins-table {
                font-size: 14px;
            }
            
            .coin-info {
                gap: 8px;
            }
            
            .sparkline {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <h1>CryptoViz Pro</h1>
                <span>Live Market Data</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by coin name or symbol...">
            </div>
        </div>

        <!-- Global Stats -->
        <div id="globalStats" class="stats-grid"></div>

        <!-- Market Overview -->
        <div class="market-header">
            <div class="market-title">📊 Market Overview</div>
            <div class="filters">
                <button class="filter-btn active" data-sort="market_cap_desc">Market Cap</button>
                <button class="filter-btn" data-sort="volume_desc">Volume</button>
                <button class="filter-btn" data-sort="gainers">Top Gainers</button>
                <button class="filter-btn" data-sort="losers">Top Losers</button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="color: rgba(255,255,255,0.7);">Fetching cryptocurrency data...</p>
        </div>

        <!-- Error -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Coins Table -->
        <div id="coinsContainer" class="coins-table-container hidden">
            <table class="coins-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Coin</th>
                        <th>Price</th>
                        <th>24h Change</th>
                        <th>Market Cap</th>
                        <th>Volume (24h)</th>
                        <th>Last 7d</th>
                    </tr>
                </thead>
                <tbody id="coinsTableBody"></tbody>
            </table>
        </div>

        <div class="footer">
            <p>Data provided by <a href="https://www.coingecko.com" target="_blank">CoinGecko</a> • Free API • Updates every 60 seconds</p>
        </div>
    </div>

    <!-- Coin Details Modal -->
    <div id="coinModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // API Configuration - CoinGecko (Free, no key needed)
        const BASE_URL = 'https://api.coingecko.com/api/v3';
        
        // DOM Elements
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const coinsContainer = document.getElementById('coinsContainer');
        const coinsTableBody = document.getElementById('coinsTableBody');
        const globalStats = document.getElementById('globalStats');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        // State
        let allCoins = [];
        let filteredCoins = [];
        let currentSort = 'market_cap_desc';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchGlobalData();
            fetchCoinsData();
            
            // Set up auto-refresh every 60 seconds
            setInterval(() => {
                fetchGlobalData();
                fetchCoinsData();
            }, 60000);
        });
        
        // Event Listeners
        searchInput.addEventListener('input', (e) => {
            filterCoins(e.target.value);
        });
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                sortAndDisplayCoins();
            });
        });
        
        // Fetch global cryptocurrency data
        async function fetchGlobalData() {
            try {
                const response = await fetch(`${BASE_URL}/global`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayGlobalStats(data.data);
            } catch (error) {
                console.error('Error fetching global data:', error);
            }
        }
        
        // Fetch coins data
        async function fetchCoinsData() {
            showLoading();
            
            try {
                const response = await fetch(
                    `${BASE_URL}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=true&price_change_percentage=24h`
                );
                
                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error('Rate limit reached. Please wait a moment.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                allCoins = data;
                filteredCoins = data;
                sortAndDisplayCoins();
                hideError();
            } catch (error) {
                showError(error.message);
                console.error('Error fetching coins:', error);
            } finally {
                hideLoading();
            }
        }
        
        // Display global stats
        function displayGlobalStats(data) {
            const totalMarketCap = formatCurrency(data.total_market_cap.usd);
            const totalVolume = formatCurrency(data.total_volume.usd);
            const btcDominance = data.market_cap_percentage.btc.toFixed(1);
            const marketCapChange = data.market_cap_change_percentage_24h_usd;
            
            globalStats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">🌍 Total Market Cap</div>
                    <div class="stat-value">${totalMarketCap}</div>
                    <div class="stat-change ${marketCapChange >= 0 ? 'positive' : 'negative'}">
                        ${marketCapChange >= 0 ? '↑' : '↓'} ${Math.abs(marketCapChange).toFixed(2)}%
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">📊 24h Volume</div>
                    <div class="stat-value">${totalVolume}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🎯 BTC Dominance</div>
                    <div class="stat-value">${btcDominance}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🪙 Active Cryptocurrencies</div>
                    <div class="stat-value">${data.active_cryptocurrencies}</div>
                </div>
            `;
        }
        
        // Filter coins based on search
        function filterCoins(searchTerm) {
            if (!searchTerm) {
                filteredCoins = allCoins;
            } else {
                const term = searchTerm.toLowerCase();
                filteredCoins = allCoins.filter(coin => 
                    coin.name.toLowerCase().includes(term) || 
                    coin.symbol.toLowerCase().includes(term)
                );
            }
            sortAndDisplayCoins();
        }
        
        // Sort and display coins
        function sortAndDisplayCoins() {
            let sortedCoins = [...filteredCoins];
            
            switch (currentSort) {
                case 'market_cap_desc':
                    sortedCoins.sort((a, b) => b.market_cap - a.market_cap);
                    break;
                case 'volume_desc':
                    sortedCoins.sort((a, b) => b.total_volume - a.total_volume);
                    break;
                case 'gainers':
                    sortedCoins.sort((a, b) => b.price_change_percentage_24h - a.price_change_percentage_24h);
                    break;
                case 'losers':
                    sortedCoins.sort((a, b) => a.price_change_percentage_24h - b.price_change_percentage_24h);
                    break;
            }
            
            displayCoins(sortedCoins);
        }
        
        // Display coins in table
        function displayCoins(coins) {
            coinsTableBody.innerHTML = '';
            
            coins.slice(0, 50).forEach((coin, index) => {
                const priceChange = coin.price_change_percentage_24h;
                const changeClass = priceChange >= 0 ? 'positive' : 'negative';
                const changeSymbol = priceChange >= 0 ? '↑' : '↓';
                
                const row = document.createElement('tr');
                row.style.cursor = 'pointer';
                row.onclick = () => showCoinDetails(coin.id);
                
                // Generate simple sparkline (using SVG)
                const sparklineData = coin.sparkline_in_7d?.price || [];
                const sparklinePath = generateSparklinePath(sparklineData);
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>
                        <div class="coin-info">
                            <img class="coin-icon" src="${coin.image}" alt="${coin.name}" onerror="this.src='https://via.placeholder.com/32'">
                            <div>
                                <div class="coin-name">${coin.name}</div>
                                <div class="coin-symbol">${coin.symbol.toUpperCase()}</div>
                            </div>
                        </div>
                    </td>
                    <td class="price-cell">${formatCurrency(coin.current_price)}</td>
                    <td class="${changeClass}">${changeSymbol} ${Math.abs(priceChange).toFixed(2)}%</td>
                    <td>${formatCurrency(coin.market_cap)}</td>
                    <td>${formatCurrency(coin.total_volume)}</td>
                    <td>
                        <svg class="sparkline" viewBox="0 0 120 40">
                            <path d="${sparklinePath}" stroke="${priceChange >= 0 ? '#10b981' : '#ef4444'}" fill="none" stroke-width="2"/>
                        </svg>
                    </td>
                `;
                
                coinsTableBody.appendChild(row);
            });
        }
        
        // Generate sparkline path
        function generateSparklinePath(data) {
            if (!data || data.length === 0) return '';
            
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min || 1;
            
            const points = data.map((value, index) => {
                const x = (index / (data.length - 1)) * 120;
                const y = 40 - ((value - min) / range) * 35;
                return `${x},${y}`;
            });
            
            return `M ${points.join(' L ')}`;
        }
        
        // Show coin details modal
        async function showCoinDetails(coinId) {
            try {
                const response = await fetch(`${BASE_URL}/coins/${coinId}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false`);
                const data = await response.json();
                
                const modal = document.getElementById('coinModal');
                const modalContent = document.getElementById('modalContent');
                
                const marketData = data.market_data;
                const priceChange24h = marketData.price_change_percentage_24h;
                
                modalContent.innerHTML = `
                    <div class="modal-coin-header">
                        <img class="modal-coin-icon" src="${data.image.large}" alt="${data.name}">
                        <div class="modal-coin-title">
                            <h2>${data.name}</h2>
                            <p>${data.symbol.toUpperCase()}</p>
                        </div>
                    </div>
                    <div class="modal-stats">
                        <div class="modal-stat">
                            <div class="modal-stat-label">Current Price</div>
                            <div class="modal-stat-value">${formatCurrency(marketData.current_price.usd)}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">24h Change</div>
                            <div class="modal-stat-value ${priceChange24h >= 0 ? 'positive' : 'negative'}">
                                ${priceChange24h >= 0 ? '+' : ''}${priceChange24h.toFixed(2)}%
                            </div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Market Cap</div>
                            <div class="modal-stat-value">${formatCurrency(marketData.market_cap.usd)}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">24h Volume</div>
                            <div class="modal-stat-value">${formatCurrency(marketData.total_volume.usd)}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">All Time High</div>
                            <div class="modal-stat-value">${formatCurrency(marketData.ath.usd)}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">All Time Low</div>
                            <div class="modal-stat-value">${formatCurrency(marketData.atl.usd)}</div>
                        </div>
                    </div>
                `;
                
                modal.classList.add('active');
            } catch (error) {
                console.error('Error fetching coin details:', error);
            }
        }
        
        // Close modal
        window.closeModal = function() {
            document.getElementById('coinModal').classList.remove('active');
        };
        
        // Format currency
        function formatCurrency(value) {
            if (!value) return '$0';
            
            if (value >= 1e12) {
                return `$${(value / 1e12).toFixed(2)}T`;
            } else if (value >= 1e9) {
                return `$${(value / 1e9).toFixed(2)}B`;
            } else if (value >= 1e6) {
                return `$${(value / 1e6).toFixed(2)}M`;
            } else if (value >= 1e3) {
                return `$${(value / 1e3).toFixed(2)}K`;
            }
            
            return value < 0.01 ? `$${value.toFixed(6)}` : `$${value.toFixed(2)}`;
        }
        
        // UI Helpers
        function showLoading() {
            loading.classList.remove('hidden');
            coinsContainer.classList.add('hidden');
        }
        
        function hideLoading() {
            loading.classList.add('hidden');
            coinsContainer.classList.remove('hidden');
        }
        
        function showError(message) {
            errorMessage.textContent = `⚠️ ${message}`;
            errorMessage.classList.remove('hidden');
            coinsContainer.classList.add('hidden');
        }
        
        function hideError() {
            errorMessage.classList.add('hidden');
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('coinModal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
